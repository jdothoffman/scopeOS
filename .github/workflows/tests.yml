name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    # The app weak-links FoundationModels, which needs the macOS 26 SDK (Xcode 26).
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: ScopeKit tests
        working-directory: Packages/ScopeKit
        run: swift test

      - name: App tests
        run: |
          xcodebuild test \
            -project ScopeOS.xcodeproj \
            -scheme ScopeOS \
            -destination 'platform=macOS' \
            -derivedDataPath build.noindex
